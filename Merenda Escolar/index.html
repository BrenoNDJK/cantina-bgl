<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merenda Escolar - Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Arial, sans-serif;
        }


        body{

            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2f00ff,#b40000);

        }



        .container{

            background:rgb(255, 255, 255);
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);

        }



        .titulo{

            text-align:center;
            margin-bottom:30px;

        }



        .titulo h1{

            color:#008cff;
            font-size:32px;

        }



        .titulo p{

            color:#0095ff;
            margin-top:8px;

        }



        h2{

            color:#0095ff;
            font-size:20px;
            margin-bottom:15px;
            border-left:5px solid #000000;
            padding-left:10px;

        }



        label{

            display:block;
            margin-bottom:6px;
            color:#555;
            font-weight:bold;

        }



        input{

            width:100%;
            padding:12px;
            margin-bottom:15px;

            border-radius:10px;
            border:1px solid #ccc;

            outline:none;
            font-size:15px;

            transition:0.3s;

        }



        input:focus{

            border-color:#1db954;

            box-shadow:
            0 0 8px rgba(29,185,84,0.4);

        }




        button{

            width:100%;
            padding:13px;

            background:#2f00ff;
            color:white;

            border:none;
            border-radius:10px;

            font-size:16px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;

        }



        button:hover{

            background:#075c2d;
            transform:translateY(-2px);

        }




        .linha{

            height:1px;
            background:#ddd;
            margin:30px 0;

        }



        .login-box{

            margin-bottom:20px;

        }



        @media(max-width:450px){

            .container{

                width:90%;
                padding:25px;

            }


            .titulo h1{

                font-size:26px;

            }

        }


    </style>

</head>



<body>



<div class="container">


    <div class="titulo">

        <h1>🍔 Merenda Escolar</h1>

        <p>Faça login para continuar</p>

    </div>




    <div class="login-box">

        <h2>Funcionário</h2>
    
    
        <label for="nomefuncionario">
            Nome do Funcionário
        </label>
    
        <input 
        type="text" 
        id="nomefuncionario"
        placeholder="Digite seu nome">
    
    
    
        <label for="senha">
            Senha do Funcionário
        </label>
    
        <input 
        type="password" 
        id="senha"
        placeholder="Digite sua senha">
    
    
    
        <button onclick="loginFuncionario()">
            Entrar como Funcionário
        </button>
    
    
    </div>




    <div class="linha"></div>





    <div class="login-box">


        <h2>Aluno</h2>


        <label for="nomealuno">
            Nome do Aluno
        </label>


        <input 
        type="text" 
        id="nomealuno"
        placeholder="Digite seu nome">





        <label for="senhaaluno">
            Senha do Aluno
        </label>


        <input 
        type="password"
        id="senhaaluno"
        placeholder="Digite sua senha">




        <button onclick="loginAluno()">
            Entrar como Aluno
        </button>



    </div>


</div>






<script>


const API = "http://localhost:3000";





async function loginFuncionario(){


    const senha =
    document.getElementById("senha").value;



    const resposta = await fetch(API + "/login",{


        method:"POST",


        headers:{

            "Content-Type":"application/json"

        },


        body:JSON.stringify({

            usuario:"tia",

            senha:senha

        })


    });



    const dados = await resposta.json();





    if(dados.sucesso && dados.tipo === "funcionario"){


        window.location.href="funcionario.html";


    }else{


        alert("Senha do funcionário incorreta!");

    }



}









async function loginAluno(){


    const usuario =
    document.getElementById("nomealuno").value;



    const senha =
    document.getElementById("senhaaluno").value;





    const resposta = await fetch(API + "/login",{


        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            usuario:usuario,


            senha:senha


        })


    });





    const dados = await resposta.json();





    if(dados.sucesso && dados.tipo === "aluno"){



        window.location.href="aluno.html";



    }else{


        alert("Nome ou senha do aluno incorretos!");

    }



}



</script>




</body>

</html>
