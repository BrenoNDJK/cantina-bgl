<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aluno - Cantina BGL</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}



body{

    min-height:100vh;
    background:color(srgb rgb(249, 247, 249) green blue)
    

}




header{

    background:linear-gradient(135deg,#2f00ff,#b40000);
    color:rgb(255, 255, 255);

    padding:25px;

    text-align:center;

    font-size:30px;

    font-weight:bold;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

}




.titulo{

    text-align:center;

    margin:35px 0 25px;

    color:#333;

    font-size:28px;

}




.produtos{


    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:25px;

    padding:20px;


}




.produto{


    background:linear-gradient(135deg,#2f00ff,#b40000);

    width:280px;

    padding:25px;

    border-radius:18px;

    box-shadow:0 8px 20px rgba(0,0,0,0.12);

    text-align:center;

    transition:.3s;


}




.produto:hover{

    transform:translateY(-5px);

    box-shadow:0 12px 25px rgba(0,0,0,0.18);

}





.produto h2{


    color:#0a1b11;

    font-size:23px;

    margin-bottom:15px;


}




.produto p{


    background:#eaf8ef;

    padding:12px;

    border-radius:10px;

    color:#555;

    font-size:17px;

    font-weight:bold;


}





.vazio{


    text-align:center;

    width:100%;

    font-size:18px;

    color:#777;

}





@media(max-width:600px){


header{

    font-size:23px;

}


.titulo{

    font-size:24px;

}


.produto{

    width:90%;

}



}


</style>


</head>



<body>




<header>

🍔 Merenda Escolar

</header>





<h2 class="titulo">

📋 Cardápio da Semana

</h2>





<section class="produtos" id="lista">


</section>







<script>


async function carregar() {


    try {


        const res = await fetch("http://localhost:3000/cardapio");


        const dados = await res.json();



        const lista = document.getElementById("lista");


        lista.innerHTML = "";





        if (dados.length === 0) {


            lista.innerHTML = 
            "<p class='vazio'>Nenhum item no cardápio ainda 😢</p>";

            return;

        }





        dados.forEach(item => {


            lista.innerHTML += `


                <div class="produto">


                    <h2>
                    🍽️ ${item.comida}
                    </h2>


                    <p>
                    📅 ${item.dia}
                    </p>


                </div>


            `;


        });



    } catch (erro) {


        console.error("Erro:", erro);


        document.getElementById("lista").innerHTML =

        "<p class='vazio'>Erro ao carregar o cardápio 😢</p>";


    }


}



carregar();



</script>



</body>

</html>
