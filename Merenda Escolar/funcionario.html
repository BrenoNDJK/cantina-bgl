<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel da Cantina</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}


body{

    min-height:100vh;
    background:linear-gradient(135deg,#ffffff,#ffffff);
    padding-bottom:40px;

}



header{

    background:linear-gradient(135deg,#2f00ff,#b40000);

    color:white;

    padding:25px;

    text-align:center;

    font-size:30px;

    font-weight:bold;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

}




.titulo{

    text-align:center;

    margin:35px 0 25px;

    color:#000000;

    font-size:28px;

}





.cadastro{

    background:white;

    width:450px;

    max-width:90%;

    margin:auto;

    padding:35px;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0, 55, 255, 0.15);

}





label{

    display:block;

    font-weight:bold;

    color:#000000;

    margin-bottom:8px;

}





select,
input{


    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:16px;

    outline:none;

    transition:.3s;

    margin-bottom:20px;


}




select:focus,
input:focus{


    border-color:#006cf9;

    box-shadow:0 0 8px rgba(20, 121, 59, 0.4);


}




button{


    width:100%;

    padding:14px;

    background:#e8eaee;

    color:rgb(0, 0, 0);

    border:none;

    border-radius:12px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;


}



button:hover{


    background:#ada2a2;

    transform:translateY(-3px);


}




hr{

    width:80%;

    margin:40px auto;

    border:none;

    height:2px;

    background:#ddd;

}





.produtos{


    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:20px;

    padding:20px;


}





.produto{


    background:linear-gradient(135deg,#2f00ff,#b40000);
    
    width:280px;
    
    padding:25px;

    border-radius:18px;

    box-shadow:0 8px 20px rgba(129, 26, 26, 0.12);

    transition:.3s;


}




.produto:hover{


    transform:translateY(-5px);


}




.produto h2{


    color: #040406;

    margin-bottom:10px;


}



.produto p{


    color:#000000;

    font-size:16px;

    margin-bottom:20px;


}




.produto button{


    width:48%;

    display:inline-block;

    font-size:14px;

    padding:10px;

    margin-right:2%;


}





@media(max-width:600px){


header{

    font-size:22px;

}


.cadastro{

    padding:25px;

}


.produto{

    width:90%;

}


}



</style>


</head>


<body>



<header>

🍔 Painel da Merenda Escolar

</header>




<h2 class="titulo">
Gerenciar Cardápio
</h2>





<div class="cadastro">


<label>
📅 Dia da Semana
</label>


<select id="dia">


<option>Segunda-feira</option>

<option>Terça-feira</option>

<option>Quarta-feira</option>

<option>Quinta-feira</option>

<option>Sexta-feira</option>


</select>





<label>
🍽️ Nome da comida
</label>


<input
type="text"
id="comida"
placeholder="Digite o nome da comida">





<button onclick="adicionar()">

➕ Adicionar ao Cardápio

</button>


</div>





<hr>





<section
class="produtos"
id="lista">


</section>






<script src="funcionario.js"></script>


</body>

</html>
