<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Burkart</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

<header>
    <h1>Cantina Burkart</h1>
</header>

<div class="Identificação">
    <label for="nomefucionario">Nome Do Funcionário</label><br>
    <input type="text" id="nomefuncionario"><br>

    <label for="senhafuncionario">Senha Do Funcionário</label><br>
    <input type="text" name="senha" id="senha"><br>
    <button onclick="loginFuncionario()">Entrar como Funcionário</button><br>

    <label for="nomealuno">Nome Do Aluno</label><br>
    <input type="text" id="nomealuno"><br>
    
    <label for="senhaaluno">Senha Do Aluno</label><br>
    <input type="text" name="senhaaluno" id="senhaaluno"><br>
    <button onclick="loginAluno()">Entrar como Aluno</button>
</div>

<script>
async function loginFuncionario() {

    const usuario = document.getElementById("nomefuncionario").value;
    const senha = document.getElementById("senha").value;

    const resposta = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usuario,
            senha
        })
    });

    const dados = await resposta.json();

    if (dados.sucesso && dados.tipo === "funcionario") {

        window.location.href = "funcionario.html";

    } else {

        alert("Usuário ou senha incorretos.");

    }

}

async function loginAluno() {

    const usuario = document.getElementById("nomealuno").value;
    const senha = document.getElementById("senhaaluno").value;

    const resposta = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usuario,
            senha
        })
    });

    const dados = await resposta.json();

    if (dados.sucesso && dados.tipo === "aluno") {

        window.location.href = "aluno.html";

    } else {

        alert("Usuário ou senha incorretos.");

    }

}
</script>
</body>
</html>
